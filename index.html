<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAREN_01 — сигнал из 5629 года</title>
<meta name="description" content="Зарен — человек из 5629 года. Эфиры, ссылки, расписание.">
<meta name="theme-color" content="#0a0d0a">
<!-- Превью для Telegram / Discord / VK. Ботам JS не выполняется — поэтому эти строки правятся прямо здесь. -->
<meta property="og:type" content="website">
<meta property="og:title" content="ZAREN_01 — сигнал из 5629 года">
<meta property="og:description" content="Человек из будущего выходит на связь. Эфиры, ссылки, расписание.">
<meta property="og:image" content="assets/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.png" type="image/png" sizes="64x64">
<link rel="preload" href="assets/fonts/pixelify-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/vt323-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="crt" aria-hidden="true"></div>

<!-- Иконки площадок (используются через <use href="#i-...">) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-twitch" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M5 3h15v10l-5 5h-4l-3 3v-3H4V6z"/><path stroke="currentColor" stroke-width="2" d="M11 8v4M16 8v4"/></symbol>
  <symbol id="i-youtube" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M10 9v6l5-3z"/></symbol>
  <symbol id="i-tiktok" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M14 3v12.5a3.5 3.5 0 1 1-3.5-3.5M14 3c.5 2.6 2.3 4.2 5 4.5"/></symbol>
  <symbol id="i-telegram" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 11.5 21 4l-3 16-6-4.5-3 3v-5l9-8-11 6.5z"/></symbol>
  <symbol id="i-discord" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M7 6c3-1.3 7-1.3 10 0 2 3 3 6.5 3 10.5-1.5 1.3-3.2 2.1-5 2.5l-1-2c-1.3.3-2.7.3-4 0l-1 2c-1.8-.4-3.5-1.2-5-2.5C4 12.5 5 9 7 6z"/><circle cx="9.5" cy="12.5" r="1.4" fill="currentColor"/><circle cx="14.5" cy="12.5" r="1.4" fill="currentColor"/></symbol>
  <symbol id="i-donate" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></symbol>
  <symbol id="i-boosty" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M8 3h5.5a3.5 3.5 0 0 1 0 7H8zM8 10h6.5a4 4 0 0 1 0 8H8zM8 3v18"/></symbol>
  <symbol id="i-antenna" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 4a10 10 0 0 0 9 14M5 4l11 5M10 6.3 7.5 12.5M12 20l-4 1h8l-2-3"/><circle cx="17" cy="9.5" r="1.5" fill="currentColor"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/></symbol>
</svg>

<div class="page">
  <!-- 1. Шапка -->
  <header class="top">
    <div class="lang" role="group" aria-label="Язык / Language">
      <button type="button" data-lang="ru" aria-pressed="true">RU</button><button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <div class="brand">
      <svg class="sym" id="sym" viewBox="0 0 40 40" role="img" aria-label="Символ Зарена"><circle cx="20" cy="20" r="15.5" fill="none" stroke="currentColor" stroke-width="3.4"/><line x1="20" y1="4.5" x2="20" y2="35.5" stroke="currentColor" stroke-width="3.4"/></svg>
      <h1 id="siteName">ZAREN_01</h1>
    </div>
    <!-- строка статуса: заполняется скриптом (в эфире / ожидается + ближайший сеанс) -->
    <p class="status wait" id="status" aria-live="polite"><span data-t="statusWait">СИГНАЛ ОЖИДАЕТСЯ</span></p>
  </header>

  <!-- 2. Аватар -->
  <section class="cam" id="blk-avatar" data-block="avatar">
    <div class="cam-bar" aria-hidden="true"><span>ZAREN-CAM-01</span><span class="rec">● REC</span></div>
    <div class="cam-view" id="camView" role="img" aria-label="Зарен, пиксельный аватар" data-t-aria="avatarLabel">
      <svg class="avatar-ph" viewBox="0 0 32 32" aria-hidden="true" shape-rendering="crispEdges">
        <path fill="currentColor" d="M12 5h8v1h2v2h1v6h-1v2h-2v1h-8v-1h-2v-2H9V8h1V6h2zM8 20h16v1h2v2h1v6H5v-6h1v-2h2z"/>
        <rect x="13" y="10" width="2" height="2" fill="#0a0d0a"/><rect x="17" y="10" width="2" height="2" fill="#0a0d0a"/>
      </svg>
    </div>
  </section>

  <!-- 3. Кто это -->
  <p class="about" id="blk-about" data-block="about"><span class="prompt" aria-hidden="true">&gt;</span> <span data-t="about">Человек из 5629 года. Застрял на Земле, выходит на связь через старый ЭЛТ-монитор и ведёт эфиры для наблюдателей.</span></p>

  <!-- 4. Каналы связи (кнопки строятся из config.json) -->
  <section id="blk-links" data-block="links" aria-labelledby="h-links">
    <h2 id="h-links" data-t="linksTitle">// КАНАЛЫ СВЯЗИ</h2>
    <div class="links" id="links"></div>
  </section>

  <!-- 5–6. Расписание и таймер -->
  <section id="blk-schedule" data-block="schedule" aria-labelledby="h-sched">
    <h2 id="h-sched" data-t="scheduleTitle">// РАСПИСАНИЕ СЕАНСОВ</h2>
    <div class="timer" id="timer" data-block="timer" hidden></div>
    <table class="sched" id="sched"></table>
    <p class="tz" id="tz"></p>
  </section>

  <!-- 7. Подвал -->
  <footer>
    <p><span data-t="collab">Сотрудничество:</span> <a class="mail" id="mail" href="#"></a> <button type="button" class="copy" id="copyMail" data-t="copy">скопировать</button></p>
    <p class="small">© <span id="year">2026</span> ZAREN_01 · <a id="source" href="#" data-t="source">исходники</a><span id="termHint" hidden> · <span data-t="terminalHint">нажмите</span> <kbd>~</kbd></span></p>
  </footer>
</div>

<noscript><p class="noscript">Для расписания и статуса эфира нужен JavaScript.</p></noscript>

<script src="js/main.js"></script>
</body>
</html>
